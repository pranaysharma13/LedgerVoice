[project]
name = "nessie-tools"
version = "0.0.1"
description = "Typed client (and, from M1, an in-memory fake) for the Capital One Nessie sandbox API"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nessie_tools"]
