[project]
name = "nessie-tools"
version = "0.0.1"
description = "Typed Nessie client, live + in-memory backends, computed balances, audited transfer saga and reconciliation"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nessie_tools"]
