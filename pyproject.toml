[project]
name = "ledgervoice"
version = "0.0.1"
description = "Real-time voice banking agent (Claude + Cartesia + Moss + Nessie)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "moss",
    "nessie-tools @ {root:uri}/packages/nessie-tools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ledgervoice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/nessie-tools/tests"]
markers = ["live: calls the real Nessie API (run with `make test-live`)"]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# D44: strict for all source code. Tests get a second, non-strict run from `make lint`
# (see Makefile: MYPY_TESTS_FLAGS) so calls to removed or renamed APIs are caught
# without annotating every test and fixture.
files = ["packages/nessie-tools/src", "src/ledgervoice"]
strict = true
