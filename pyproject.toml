[project]
name = "ledgervoice"
version = "0.0.1"
description = "Real-time voice banking agent (Claude + Cartesia + Moss + Nessie)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "moss",
    "nessie-tools",          # installed from packages/nessie-tools by `make setup`
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgervoice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/nessie-tools/tests"]
